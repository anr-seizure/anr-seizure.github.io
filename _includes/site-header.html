<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="SEIZURE home">
      SE<b>I</b>ZURE
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul class="nav-list">
        {%- for item in site.nav -%}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>
    <div class="header-tools">
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon sun" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon moon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
    </div>
  </div>
</header>
