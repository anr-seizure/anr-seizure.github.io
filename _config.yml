title: SEIZURE
description: >
  SEIZURE is an ANR research project fusing MRI, PET and MEG with machine learning to localize the
  epileptogenic zone in drug-resistant epilepsy and predict surgical outcome.
baseurl: ""
url: "https://anr-seizure.github.io"
lang: en

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-seo-tag

# Primary navigation, rendered in the header.
nav:
  - { title: Overview, url: /overview/ }
  - { title: Members, url: /members/ }
  - { title: Publications, url: /publications/ }
  - { title: Positions, url: /positions/ }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - tests/
  - docs/
  - vendor/
  - .idea/
