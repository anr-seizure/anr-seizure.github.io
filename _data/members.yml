# Project members, grouped by host institution. Cards render from this file.
#
# Fields (all optional except firstname/lastname):
#   key         short unique id, also used to attach auto fetched publications (member_pubs.yml)
#   role        short role label shown as a badge (PI, PhD student, Postdoc, Engineer, Clinician, ...)
#   lead        true to mark a principal investigator (sorted first, highlighted)
#   institutions list of institution keys from institutions.yml (first is the primary chip)
#   picture     file in members/
#   interests   short comma separated list
#   thesis      for PhD students: { title, supervisors, start }
#   idhal       HAL author id in slug form (used to fetch publications and link the HAL CV)
#   idhal_numeric HAL numeric author id, used when no slug idHAL exists
#   orcid       ORCID id (0000-0000-0000-0000)
#   thesesfr    theses.fr url
#   website     personal or professional homepage
#
# Publications are fetched automatically from HAL by scripts/fetch_hal.py into member_pubs.yml;
# you never edit that file by hand.

member_list_title: Members

